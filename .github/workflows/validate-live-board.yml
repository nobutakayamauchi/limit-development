name: Validate Limit Development Live Board

on:
  pull_request:
    paths:
      - 'index.html'
      - 'development.html'
      - 'request-lab.html'
      - 'product-*.html'
      - 'history.html'
      - 'PUBLICATION_SAFETY.md'
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile board builder
        run: python -m py_compile scripts/build_board.py

      - name: Validate source JSON
        run: |
          python -m json.tool data/control-state.json >/dev/null
          python -m json.tool data/current-board.json >/dev/null
          python -m json.tool data/history/index.json >/dev/null

      - name: Build board from live public GitHub telemetry
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/build_board.py --output /tmp/current-board.json
          python -m json.tool /tmp/current-board.json >/dev/null

      - name: Prove UNKNOWN is preserved when GitHub API is unavailable
        run: |
          python - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, 'scripts')
          import build_board
          build_board.safe_call = lambda path: None
          control = json.loads(pathlib.Path('data/control-state.json').read_text())
          out = build_board.build_current(control)
          assert out['projects'][0]['telemetry']['open_prs'] == 'UNKNOWN'
          assert out['projects'][0]['telemetry']['latest_action'] == 'UNKNOWN'
          print('fail-closed telemetry: PASS')
          PY

      - name: Prove unapproved fields cannot leak into public board
        run: |
          python - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, 'scripts')
          import build_board
          build_board.safe_call = lambda path: None
          control = json.loads(pathlib.Path('data/control-state.json').read_text())
          control['internal_strategy'] = 'DO_NOT_PUBLISH'
          control['customer_email'] = 'private@example.invalid'
          control['projects'][0]['secret_token'] = 'super-secret'
          control['projects'][0]['vulnerability_detail'] = 'private exploit detail'
          control['metrics']['cash_balance'] = 123456
          out = build_board.build_current(control)
          encoded = json.dumps(out, ensure_ascii=False)
          for forbidden in [
              'DO_NOT_PUBLISH',
              'private@example.invalid',
              'super-secret',
              'private exploit detail',
              'cash_balance',
              '123456',
          ]:
              assert forbidden not in encoded, forbidden
          assert 'internal_strategy' not in out
          assert 'secret_token' not in out['projects'][0]
          assert 'vulnerability_detail' not in out['projects'][0]
          print('public allowlist leak test: PASS')
          PY

      - name: Prove raw commit messages are not republished
        run: |
          python - <<'PY'
          import json, pathlib, sys
          sys.path.insert(0, 'scripts')
          import build_board
          def fake(path):
              if '/commits?' in path:
                  return [{'commit': {'message': 'SECRET VULNERABILITY DETAILS', 'committer': {'date': '2026-08-18T00:00:00Z'}}}]
              if '/pulls?' in path:
                  return []
              if '/actions/runs?' in path:
                  return {'workflow_runs': [{'conclusion': 'success'}]}
              return None
          build_board.safe_call = fake
          control = json.loads(pathlib.Path('data/control-state.json').read_text())
          out = build_board.build_current(control)
          encoded = json.dumps(out, ensure_ascii=False)
          assert 'SECRET VULNERABILITY DETAILS' not in encoded
          print('raw commit message suppression: PASS')
          PY
