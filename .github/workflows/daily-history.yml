name: Limit Development Daily History

on:
  schedule:
    - cron: '55 14 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: limit-development-daily-history
  cancel-in-progress: false

jobs:
  seal-daily:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build JST daily sheet
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          DAY=$(TZ=Asia/Tokyo date +%F)
          python scripts/build_board.py --daily "data/history/${DAY}.json" --day "$DAY"

      - name: Commit one daily record
        run: |
          if git diff --quiet -- data/history; then
            echo "No daily history change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history
          git commit -m "Seal daily development history"
          git push
