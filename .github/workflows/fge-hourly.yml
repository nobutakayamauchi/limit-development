name: FGE hourly review build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "foundry-growth-engine/**"
      - ".github/workflows/fge-hourly.yml"
      - ".github/workflows/fge-publish.yml"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  build-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test plain core and adapters
        run: python -m unittest discover -s foundry-growth-engine/tests -v
        env:
          PYTHONPATH: foundry-growth-engine

      - name: Detect new repositories and open intake gate
        if: github.event_name != 'pull_request'
        run: |
          python foundry-growth-engine/scripts/repo_intake.py \
            --config foundry-growth-engine/config/repo-intake.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FGE_REPO_INTAKE_TOKEN: ${{ secrets.FGE_REPO_INTAKE_TOKEN }}

      - name: Build KNOWLEDGE review candidate
        run: |
          python foundry-growth-engine/scripts/run_hourly.py \
            --repo . \
            --knowledge foundry-growth-engine/config/knowledge.limit-development.json \
            --output foundry-growth-engine/site \
            --lookback-days 30

      - name: Build PLAIN regression baseline
        run: |
          python foundry-growth-engine/scripts/run_hourly.py \
            --repo . \
            --plain \
            --output foundry-growth-engine/site-plain \
            --lookback-days 30

      - name: Compare PLAIN and KNOWLEDGE output
        run: |
          python foundry-growth-engine/scripts/compare_modes.py \
            --plain foundry-growth-engine/site-plain/data/updates.json \
            --knowledge foundry-growth-engine/site/data/updates.json \
            --output foundry-growth-engine/PLAIN_VS_KNOWLEDGE.md

      - name: Package review candidate and baseline
        uses: actions/upload-artifact@v4
        with:
          name: fge-review-${{ github.run_id }}
          path: |
            foundry-growth-engine/site
            foundry-growth-engine/site-plain
            foundry-growth-engine/PLAIN_VS_KNOWLEDGE.md
            foundry-growth-engine/config
          if-no-files-found: error

      - name: Review gate summary
        run: |
          {
            echo "### FOUNDRY GROWTH ENGINE review candidate"
            echo
            echo "仕事してください。公開直前まで、こっちでやっときます。"
            echo
            echo "Primary: KNOWLEDGE mode"
            echo "Baseline: PLAIN mode (not published)"
            echo "Comparison: PLAIN_VS_KNOWLEDGE.md"
            echo
            echo "Artifact: fge-review-${{ github.run_id }}"
            echo
            echo "- 投稿: publish KNOWLEDGE candidate with this run ID"
            echo "- 修正: edit Knowledge / regenerate the candidate first"
            echo "- 記録だけ: run FGE reviewed publish with record_only"
          } >> "$GITHUB_STEP_SUMMARY"
