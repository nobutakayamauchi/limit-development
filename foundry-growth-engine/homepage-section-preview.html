<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f9fc">
<title>FOUNDRY GROWTH ENGINE（仕事してください。）| Homepage Section Preview</title>
<style>html,body{margin:0;background:#f7f9fc;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI","Noto Sans JP",sans-serif}</style>
</head>
<body>
<main id="mount" aria-live="polite"></main>
<script>
fetch('./homepage-section.html',{cache:'no-store'})
  .then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()})
  .then(html=>{document.getElementById('mount').innerHTML=html})
  .catch(error=>{document.getElementById('mount').textContent='Preview load failed: '+error.message});
</script>
</body>
</html>
