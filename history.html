<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日誌 | 限界開発</title><style>:root{--bg:#080a09;--fg:#f5f4ef;--muted:#aaa99f;--line:#2c302c;--card:#111411;--green:#9de48f;--max:850px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic UI",sans-serif;line-height:1.8}.wrap{width:min(var(--max),calc(100% - 28px));margin:auto}.nav{padding:18px 0;border-bottom:1px solid var(--line)}a{color:inherit}.nav a{text-decoration:none;font-weight:900}.hero{padding:70px 0 44px}.tag{font-size:11px;letter-spacing:.16em;color:var(--green);font-weight:950}h1{font-size:clamp(48px,9vw,82px);line-height:.95;letter-spacing:-.055em;margin:10px 0 20px}.lead{font-size:clamp(19px,3vw,27px);font-weight:850}.days{padding:20px 0 70px}.day{padding:22px;border:1px solid var(--line);border-radius:15px;background:var(--card);margin:12px 0}.day h2{margin:0 0 9px;font-size:28px}.meta{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.cell{padding:12px;border:1px solid var(--line);border-radius:9px}.cell b{display:block}.empty{padding:24px;border:1px dashed var(--line);border-radius:14px;color:var(--muted)}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="nav"><div class="wrap"><a href="index.html">← 限界開発 LIVE</a></div></div><header class="hero"><div class="wrap"><div class="tag">DAILY HISTORY / ONE SHEET A DAY</div><h1>限界開発 日誌</h1><p class="lead">黒板は毎時消える。ここには、一日の終わりに残す価値があった事実だけを一枚ずつ保存します。</p></div></header><main class="days"><div class="wrap" id="days"><div class="empty">日次記録を読み込み中…</div></div></main><script>const esc=v=>String(v??'UNKNOWN').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function load(){const box=document.getElementById('days');try{const idx=await fetch('data/history/index.json',{cache:'no-store'}).then(r=>r.json());if(!idx.days||!idx.days.length){box.innerHTML='<div class="empty">まだ確定済みの日誌はありません。最初の日次seal後にここへ並びます。</div>';return}const rows=[];for(const f of idx.days){const d=await fetch('data/history/'+f,{cache:'no-store'}).then(r=>r.json());const activity=(d.repo_activity||[]).map(x=>`${esc(x.name)} ${esc(x.commits)} commits`).join(' / ');rows.push(`<article class="day"><div class="meta">${esc(d.date)}</div><h2>${esc(d.main_project_at_close)}</h2><p>${esc(d.focus_at_close)}</p><div class="grid"><div class="cell"><b>MODE</b>${esc(d.mode_at_close)}</div><div class="cell"><b>PUBLIC COMMITS</b>${esc(d.public_commit_count)}</div><div class="cell"><b>REQUESTS</b>${esc(d.requests)}</div><div class="cell"><b>SHIPPED</b>${esc(d.shipped)}</div></div><p class="meta">${activity||'公開repo活動なし / UNKNOWN'}</p></article>`)}box.innerHTML=rows.join('')}catch(e){box.innerHTML='<div class="empty">日誌データを取得できませんでした。GitHub上の正本を確認してください。</div>'}}load();</script></body></html>
